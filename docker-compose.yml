services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trincheiras
      POSTGRES_PASSWORD: trincheiras
      POSTGRES_DB: trincheiras
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trincheiras -d trincheiras"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql+psycopg://trincheiras:trincheiras@db:5432/trincheiras
      ADMIN_TOKEN: dev-admin-token
      # Local development only. Anywhere else, generate one: openssl rand -hex 32
      SESSION_SECRET: dev-only-session-secret-do-not-deploy-0000
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
