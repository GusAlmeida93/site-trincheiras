{% extends "admin/base.html" %}

{% block title %}Definir senha{% endblock %}

{% block content %}
<section class="card card-narrow">
  <h1>Definir senha</h1>
  <p class="lead">Escolha a senha que você vai usar para entrar na área do professor.</p>
  <form id="set-password-form" class="form" method="post" action="/admin/definir-senha">
    <label for="new-password">Nova senha</label>
    <input id="new-password" name="password" type="password" autocomplete="new-password"
      minlength="{{ password_min_length }}" maxlength="128" required aria-describedby="new-password-hint">
    <p id="new-password-hint" class="hint">Pelo menos {{ password_min_length }} caracteres.</p>

    <label for="new-password-repeat">Repita a senha</label>
    <input id="new-password-repeat" name="password_repeat" type="password" autocomplete="new-password"
      maxlength="128" required>

    <p id="form-error" class="notice notice-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary" disabled>Salvar senha</button>
  </form>
</section>
{% endblock %}
